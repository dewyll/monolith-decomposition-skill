<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">monolith-decomposition</title>
  <desc id="desc">One large block is split, phase by phase, into a set of connected services.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mono" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>

  <!-- the monolith -->
  <g transform="translate(80 70)">
    <rect width="190" height="220" rx="14" fill="url(#mono)"/>
    <g stroke="#fed7aa" stroke-opacity=".45" stroke-width="2" stroke-dasharray="6 6" fill="none">
      <path d="M0 74 H190"/><path d="M0 146 H190"/><path d="M95 0 V220"/>
    </g>
  </g>

  <!-- phases -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="13" fill="#cbd5e1" text-anchor="middle">
    <path d="M300 180 H560" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
    <g fill="#334155">
      <circle cx="320" cy="180" r="13"/><circle cx="360" cy="180" r="13"/><circle cx="400" cy="180" r="13"/>
      <circle cx="440" cy="180" r="13"/><circle cx="480" cy="180" r="13"/><circle cx="520" cy="180" r="13"/>
    </g>
    <g fill="#f8fafc" font-weight="700" font-size="12">
      <text x="320" y="184">1</text><text x="360" y="184">2</text><text x="400" y="184">3</text>
      <text x="440" y="184">4</text><text x="480" y="184">5</text><text x="520" y="184">6</text>
    </g>
    <text x="420" y="150">size · share · flatten · couple · group · serve</text>
    <text x="420" y="222" fill="#94a3b8" font-size="12">artifact → RFC → fitness → approval</text>
  </g>

  <!-- the services -->
  <g stroke="#64748b" stroke-width="2" fill="none">
    <path d="M660 110 L760 175"/><path d="M660 250 L760 185"/><path d="M800 180 L880 110"/>
    <path d="M800 180 L880 250"/><path d="M660 110 L660 250" stroke-dasharray="5 6"/>
  </g>
  <g>
    <rect x="610" y="78" width="100" height="64" rx="12" fill="#38bdf8"/>
    <rect x="610" y="218" width="100" height="64" rx="12" fill="#a78bfa"/>
    <rect x="740" y="148" width="80" height="64" rx="12" fill="#34d399"/>
    <rect x="850" y="78" width="80" height="64" rx="12" fill="#fbbf24"/>
    <rect x="850" y="218" width="80" height="64" rx="12" fill="#f472b6"/>
  </g>

  <!-- title -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
    <text x="990" y="160" fill="#f8fafc" font-size="30" font-weight="800">monolith</text>
    <text x="990" y="196" fill="#f8fafc" font-size="30" font-weight="800">decomposition</text>
    <text x="990" y="230" fill="#94a3b8" font-size="15">an agent skill, any language</text>
  </g>
</svg>
